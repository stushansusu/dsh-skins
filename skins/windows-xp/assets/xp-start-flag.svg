    <rect x="1.2" y="9.6" width="6.9" height="5.5" rx="0.7" fill="#00A4EF"/>
    <rect x="9.6" y="8.5" width="6.9" height="5.5" rx="0.7" fill="#FFB900"/>
  </g>
</svg>
