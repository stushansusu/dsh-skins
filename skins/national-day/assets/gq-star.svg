<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- 国庆 · 山河华灯：工作区分组行的图标（五角星）。
       只当 **mask** 用（见 _gq.mjs 里那一节），所以这里画什么颜色都不进画面 ——
       mask 走 alpha，填黑即可；星星的颜色由 CSS 的 background-color: currentColor
       继承，于是枫金/烟花金（收起）与旗红/宫灯红（展开）两档自动跟着走，
       不用出明暗四份资产。
       外接圆 R=7.35、内接圆 r=R*sin18/sin54=2.807（正五角星的标准做法，尖角朝上）。
       描边用同色 + 圆角，是为了把十个尖角磨钝一点 —— 16px 上纯尖角会显脏。 -->
  <path d="M8.00 0.65 L9.65 5.73 L14.99 5.73 L10.67 8.87 L12.32 13.95 L8.00 10.81 L3.68 13.95 L5.33 8.87 L1.01 5.73 L6.35 5.73 Z"
        fill="#000000" stroke="#000000" stroke-width="1.1" stroke-linejoin="round"/>
</svg>
